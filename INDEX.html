<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Birthday Hunt 🎁</title>
<style>
:root{--bg:#fff4f0;--card:#ffffff;--ink:#3a2330;--muted:#8a6b78;--accent:#e8517a;--accent2:#ffb347;--ok:#2f9e6a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1420;--card:#2a1d2e;--ink:#fbeaf1;--muted:#c39ab0;--accent:#ff6f98;--accent2:#ffc15e;--ok:#5fd6a0}}
:root[data-theme="dark"]{--bg:#1d1420;--card:#2a1d2e;--ink:#fbeaf1;--muted:#c39ab0;--accent:#ff6f98;--accent2:#ffc15e;--ok:#5fd6a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:24px 18px 40px;text-align:center}
h1{font-size:1.7rem;margin:.2em 0}
p{line-height:1.55}
.muted{color:var(--muted);font-size:.95rem}
.box{font-size:7rem;cursor:pointer;display:inline-block;animation:wob 1.6s ease-in-out infinite;user-select:none;margin:.3em 0}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.05)}}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1rem;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.97)}
.card{background:var(--card);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 18px rgba(0,0,0,.08);text-align:left}
.dots{display:flex;justify-content:center;gap:8px;margin:14px 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);opacity:.3}
.dot.done{background:var(--ok);opacity:1}.dot.now{background:var(--accent);opacity:1}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--muted);background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:.9rem;padding:6px 0}
.msg{margin-top:8px;min-height:1.4em;font-size:.95rem}
.reward{border-left:4px solid var(--accent2);padding-left:12px;margin-top:12px}
.hide{display:none}
.fall{position:fixed;top:-30px;font-size:1.6rem;animation:fall 3.5s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<main>

<section id="intro">
  <p class="muted">A little something, just for you</p>
  <h1 id="title"></h1>
  <div class="box" id="giftbox" role="button" aria-label="Open the gift box">🎁</div>
  <p>Tap the box to begin.</p>
</section>

<section id="hunt" class="hide">
  <h1>The Birthday Hunt</h1>
  <div class="dots" id="dots"></div>
  <div class="card" id="clueCard"></div>
</section>

<section id="finale" class="hide">
  <div class="box" style="animation:none">🎉</div>
  <h1 id="finalTitle"></h1>
  <div class="card"><p id="finalText" style="white-space:pre-line"></p></div>
  <button class="btn" id="again">Replay 🔁</button>
</section>

</main>
<script>
/* ===== EDIT THIS PART ===== */
const CONFIG = {
  name: "Keerthi",          // her name or nickname
  from: "Prem",              // your name
  finalTitle: "Happy Birthday!",
  finalText: "Happy Birthday to my first female friend and my sister.\n\nEven though you are far away, you are always close to my heart. Thank you for every memory and every laugh.\n\nLove, Prem\n\nMaze kar...",
  clues: [
    { riddle: "What is the most memorable part of our days together?", answer: ["tution","tuition","tutions","tuitions"], hint: "Where we studied (and talked more than we studied) 😄",
      reward: "Those tuition days were the best. Every boring class turned into a good memory because you were there." },
    { riddle: "Finish the sentence: we can never stop ____ together.", answer: ["laugh"], hint: "It's what we do when we should be serious.",
      reward: "Our silly jokes and endless laughing, no one else gets them, and that's what makes them ours." },
    { riddle: "Which theme song do we both love?", answer: ["doraemon","doremon","doraemon theme","doramon"], hint: "A blue robot cat from the future.",
      reward: "Whenever that Doraemon song plays, I think of you. Some songs just stay with you forever." },
    { riddle: "What is my special nickname for you?", answer: ["moti"], hint: "Only I call you this.",
      reward: "Yes, Moti! Nobody else gets to call you that." }
  ]
};
/* ========================== */

const $ = id => document.getElementById(id);
let step = 0;
$("title").textContent = "Hey " + CONFIG.name + ", a gift is waiting 💝";
$("finalTitle").textContent = CONFIG.finalTitle + " " + CONFIG.name + " 🎂";
$("finalText").textContent = CONFIG.finalText;

function rain(){
  const e = ["🎈","✨","🎉","💖","🎂","🌟"];
  for(let i=0;i<30;i++){
    const s=document.createElement("span");
    s.className="fall";s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*1.5+"s";
    document.body.appendChild(s);setTimeout(()=>s.remove(),5500);
  }
}
function dots(){
  $("dots").innerHTML = CONFIG.clues.map((_,i)=>'<span class="dot '+(i<step?'done':i===step?'now':'')+'"></span>').join("");
}
function show(id){["intro","hunt","finale"].forEach(s=>$(s).classList.toggle("hide",s!==id));}

function render(){
  dots();
  const c = CONFIG.clues[step];
  $("clueCard").innerHTML =
    '<strong>Clue '+(step+1)+' of '+CONFIG.clues.length+'</strong><p>'+c.riddle+'</p>'+
    '<input id="ans" placeholder="Your answer" autocomplete="off">'+
    '<div class="row"><button class="btn" id="go">Unlock</button><button class="link" id="hint">Need a hint?</button></div>'+
    '<div class="msg" id="msg"></div>';
  $("go").onclick = check;
  $("ans").onkeydown = e => { if(e.key==="Enter") check(); };
  $("hint").onclick = () => { $("msg").style.color="var(--muted)"; $("msg").textContent = "💡 " + c.hint; };
}
function check(){
  const c = CONFIG.clues[step];
  const v = $("ans").value.trim().toLowerCase();
  if(!v){return;}
  if(c.answer.some(a => v.includes(a.toLowerCase()))){
    $("clueCard").innerHTML =
      '<strong>Unlocked! ✅</strong><div class="reward"><p>'+c.reward+'</p></div>'+
      '<button class="btn" id="next">'+(step===CONFIG.clues.length-1?'Open the final gift 🎁':'Next clue →')+'</button>';
    $("next").onclick = () => { step++; if(step>=CONFIG.clues.length){dots();show("finale");rain();} else render(); };
    step < CONFIG.clues.length && dots();
  } else {
    $("msg").style.color="var(--accent)";$("msg").textContent="Not quite. Try again or tap for a hint 😉";
  }
}
$("giftbox").onclick = () => { rain(); setTimeout(()=>{show("hunt");render();},700); };
$("again").onclick = () => { step=0; show("intro"); };
</script>
</body>
</html>
